<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempo com meu amor</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
    }
    h1 { color: #f4a7b9; margin-bottom: 10px; }
    #tempo { font-size: 1.2em; margin: 20px 0; }
    .footer { font-size: 0.9em; opacity: 0.9; }
    .frase {
      margin-top: 15px;
      font-size: 1em;
      font-style: italic;
      color: #ffd1dc;
      opacity: 0.95;
      text-align: center;
      line-height: 1.5;
    }
    .botao {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      background-color: #f4a7b9;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1.1em;
      font-weight: bold;
      transition: 0.3s;
    }
    .botao:hover {
      background-color: #e38fa3;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Quanto tempo eu te amo (e aumentando)</h1>
    <div id="tempo">Carregando...</div>

    <div class="frase">
      E mesmo assim...<br>
      eu escolheria você de novo, todo dia.
    </div>

    <div class="footer">
      Desde 21 de setembro de 2025<br>
      às 03:14
    </div>

    <a href="escolha.html" class="botao">Continuar</a>
  </div>

  <script>
    const inicio = new Date(2025, 8, 21, 3, 14, 0); // setembro = 8

    function atualizar() {
      const agora = new Date();
      let diff = Math.floor((agora - inicio) / 1000);

      const dias = Math.floor(diff / (60 * 60 * 24));
      diff %= (60 * 60 * 24);

      const horas = Math.floor(diff / (60 * 60));
      diff %= (60 * 60);

      const minutos = Math.floor(diff / 60);
      const segundos = diff % 60;

      document.getElementById("tempo").innerText =
        `${dias} dias, ${horas} horas, ${minutos} minutos e ${segundos} segundos`;
    }

    atualizar();
    setInterval(atualizar, 1000);
  </script>
</body>
</html>
